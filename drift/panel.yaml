# The panel is part of the data, not a configuration to tune (PLAN.md section 2.2).
#
# Identifiers are chosen on the day of the first run from each vendor's current list and the
# date is recorded in `chosen`. Until then the runner refuses to run. When a vendor retires an
# identifier, the runner keeps calling it and the error is the result.
#
# Arms: one dated snapshot and its floating alias per vendor family (mid-tier), plus one
# open-weights control with a fixed weight hash served by the openweights provider.
#
# Anthropic (decided 2026-09-10): the vendor's model ids from the 4.6 generation on are
# pinned snapshots with no separate floating alias, so the snapshot-and-alias pair can only
# be formed on Haiku 4.5 (dated id plus undated alias). Because Haiku 4.5 may be retired
# during the twelve months (earliest 2026-10-15), a snapshot-only arm on the current
# mid-tier model (Sonnet 5) is carried from the first run so the Anthropic series survives
# the retirement. Eight arms in total.
#
# Arm keys start with the provider name: the monthly job runs one provider per parallel job
# and collects each provider's arm directories by that prefix.
#
# Findings from the live calls of 2026-09-10 (smoke workflow), for the choice on run day:
#   anthropic: claude-haiku-4-5 resolves to claude-haiku-4-5-20251001, so the pair is real
#              even though the models endpoint does not list the alias.
#   openai:    gpt-5.4-mini <-> gpt-5.4-mini-2026-03-17 is the current mid-tier pair. The
#              gpt-5.4 family rejects reasoning_effort "minimal" and accepts "none"; without
#              it a reasoning model spends the token budget thinking and returns no text.
#              Fix the value per arm in `extra`, for the life of the panel.
#   google:    gemini-flash-latest resolved to gemini-3.8-flash and returned no text within
#              64 tokens (thinking on by default); gemini-flash-lite-latest resolved to
#              gemini-3.5-flash-lite and answered. The Flash pair needs a thinkingConfig in
#              `extra` under generationConfig; the Flash-Lite pair does not. Decide which
#              tier is "mid" for Google on run day.
#   openweights: 275 identifiers, none dated; the control stays a fixed named checkpoint.

# Confirmed 2026-09-12 from the vendors' current lists (run 34664503257) and live resolutions
# (run 34664591064):
#
#   anthropic  11 identifiers. claude-haiku-4-5-20251001 is listed; the undated
#              claude-haiku-4-5 is NOT, and `panel candidates` therefore reports no pair for
#              this vendor at all. A live call to the undated id returned
#              claude-haiku-4-5-20251001, so the pair is real and is named by hand. That the
#              alias works while being unlisted is itself worth having on the record.
#              claude-sonnet-5 is undated and is the only Sonnet 5 id, which is the pinned
#              snapshot this generation offers.
#   openai     130 identifiers, 41 detected pairs, including
#              gpt-5.4-mini-2026-03-17 <-> gpt-5.4-mini. The mini line stops at 5.4: there is
#              no gpt-5.5-mini, so 5.4-mini is still the current mid-tier.
#   google     55 identifiers. gemini-flash-latest resolved to gemini-3.8-flash on 2026-09-12,
#              the same version as on 2026-09-10. Versioned rather than dated, so the pair
#              cannot be detected automatically and both halves are named by hand.
#   openweights 275 identifiers, none dated.
#
# Also reproduced live on 2026-09-12, and the reason the `extra` blocks below exist:
# gemini-flash-latest returned 8 in / 61 out and NO TEXT inside the smoke budget, while the
# same model called directly returned 'OK' at 8 in / 60 out. The same model, the same budget,
# text one time and not the other. Thinking is on by default and the answer only fits when it
# happens to think less, which is exactly the silent near-zero this panel must not measure.
#
# The OpenAI setting is confirmed by the vendor's own refusal: a call carrying
# reasoning_effort "minimal" returned 400 "Unsupported value ... Supported values are: 'none',
# 'low', 'medium', 'high', and 'xhigh'". So "none" is the right value, and a wrong one is an
# error rather than an empty answer. Neither `extra` block has yet been proved to PRODUCE text
# at the panel's budgets; the first dry run is what proves that.

version: 1
chosen: 2026-09-12
notes: "Seven identifiers confirmed 2026-09-12 against the vendors' own model lists and, where a list does not publish an alias, against a live call that showed what it resolves to (run 34664591064). The open-weights control is the one arm still to choose. Re-read on run day and report any difference rather than correcting it silently."

arms:
  - key: anthropic-snapshot
    provider: anthropic
    model: claude-haiku-4-5-20251001
    arm: snapshot
    family: claude-haiku
  - key: anthropic-alias
    provider: anthropic
    model: claude-haiku-4-5
    arm: alias
    family: claude-haiku
  - key: anthropic-sonnet-snapshot
    provider: anthropic
    model: claude-sonnet-5
    arm: snapshot
    family: claude-sonnet
  # The `extra` fields below are set from the live findings of 2026-09-10 and are NOT yet
  # proved. Both vendors have a default that can eat the whole output budget before any text
  # is produced, and multiple choice runs at 16 tokens and long-context recall at 64, so an
  # unconfigured arm would score near zero on two whole blocks for a reason that is not the
  # model's (PLAN.md section 8). Prove both with a live smoke call BEFORE the first dry run.
  # Either way the failure is loud: a rejected field is an error, not a silent empty answer.
  - key: openai-snapshot
    provider: openai
    model: gpt-5.4-mini-2026-03-17
    arm: snapshot
    family: gpt
    # The gpt-5.4 family rejects "minimal" and accepts "none"; without it a reasoning model
    # spends the token budget thinking and returns no text.
    extra:
      reasoning_effort: none
  - key: openai-alias
    provider: openai
    model: gpt-5.4-mini
    arm: alias
    family: gpt
    extra:
      reasoning_effort: none
  # Google tier decided 2026-09-11: Flash, not Flash-Lite. The plan says each vendor's
  # mid-tier, and Flash is that; Flash-Lite is a tier below what Anthropic and OpenAI are
  # compared at. Measured from the sealed suite, Flash costs about CA$1.70 a run more than
  # Flash-Lite and the whole eight-arm panel lands near CA$19 against the CA$25 budgeted, so
  # the choice was made on what it measures, not on price.
  #
  # Thinking is on by default on Flash, so the thinkingConfig below is required or the arm
  # returns no text inside the 16-token multiple-choice budget. boundary merges
  # generationConfig rather than replacing it.
  #
  # Google's identifiers are versioned, not dated, so `snapshot_alias_pairs` cannot detect
  # this pair and it is named by hand: a pinned version as the snapshot, the floating
  # `gemini-flash-latest` as the alias. That alias moving from one version to another is the
  # single most valuable signal in the panel.
  - key: google-snapshot
    provider: google
    model: gemini-3.8-flash
    arm: snapshot
    family: gemini
    extra:
      generationConfig:
        thinkingConfig:
          thinkingBudget: 0
  - key: google-alias
    provider: google
    model: gemini-flash-latest
    arm: alias
    family: gemini
    extra:
      generationConfig:
        thinkingConfig:
          thinkingBudget: 0
  # The control, chosen 2026-09-12. Fixed weights served by Together, so anything that moves
  # in this arm across twelve months is measurement noise rather than the model changing: that
  # is the baseline every drift call is made against. `-Turbo` is Together's FP8 serving of the
  # checkpoint below, so the weights are pinned but the serving stack is theirs; if that ever
  # changes underneath us it shows up here as noise, which is the honest place for it to land.
  # weight_hash is the HuggingFace main-branch commit of meta-llama/Llama-3.3-70B-Instruct,
  # read 2026-09-12, last modified 2024-12-21.
  - key: openweights-control
    provider: openweights
    model: meta-llama/Llama-3.3-70B-Instruct-Turbo
    arm: control
    family: control
    weight_hash: 6f6073b423013f6a7d4d9f39144961bfbfbc386b
