# Price list, USD per million tokens, re-read from each vendor's price page on 2026-09-30.
# Repricing is a new dated file, never an edit to an older one. This file supersedes
# 2026-09-12.yaml: every rate in that file is carried here unchanged (a test holds it to that),
# plus two judge candidates for the multi-part stratum of the gold set.
#
# Why these two, added 2026-09-30. Every judge on the panel was refused on the multi-part
# stratum under rubric v3 (docs/gate-action.md), and the next hypothesis is a larger model. A
# judge is pinned to a dated identifier where the vendor offers one, and a dated identifier is
# priced by its own entry: boundary prices by the returned id and then the requested one, and
# for a dated request both are the dated id, so the gpt-5.4 entry would not cover it and the
# call would be written uncosted, outside the spend cap.
#
#   openai/gpt-5.4-2026-03-05      the dated snapshot of gpt-5.4, listed by OpenAI's models
#                                  endpoint on 2026-09-20 (run 35529080046). Same rate as
#                                  gpt-5.4.
#   google/gemini-3.1-pro-preview  Google offers no stable Pro model and no dated one; this is
#                                  the only Pro text identifier its models endpoint listed. The
#                                  rate is the prompts-up-to-200k tier (2.00 in, 12.00 out,
#                                  thinking billed as output); a judge prompt is a few thousand
#                                  tokens. No cache rate: the judge never caches, and a cached
#                                  call with no rate would be written uncosted.
#
# Dated 2026-10-01, the day it takes effect, not the day it was read. `latest_price_list` takes
# the newest file by name, so a file here is the monthly drift run's price list from the moment
# it is merged. It was merged on 2026-10-01 once that day's drift run had started on the commit
# before it (12418eb). Each of the run's jobs reads the commit it started on, so that run was
# priced by 2026-09-12.yaml. No drift arm's rate differs between the two in any case.
#
# **A known future change.** Google's page shows Gemini 3.8 Flash (and 3.6 and 3.7) at 0.75 in
# and 3.75 out "through Dec 31, 2026", and 1.50 and 7.50 from 2027-01-01. Both Google drift
# arms and the gate's licensed judge are on it. A file dated 2027-01-01 is committed after the
# December run and before the January one, and not earlier, because the newest file applies at
# once.
#
# The two panel entries added on 2026-09-12 (the OpenAI snapshot and the Google alias) are
# explained in 2026-09-12.yaml. Its caveat still applies:
#
# **A caveat on the alias entry.** Pricing a floating alias by name means that if it moves to a
# version this file does not list, the returned id misses, the requested id hits, and the call
# is priced at the old version's rate instead of being written uncosted. The move itself is
# still visible: `model_returned` is in every ledger row and a resolution change is the single
# most valuable signal this panel produces. The cost is what would be quietly wrong, and the
# monthly ledger-against-invoice check is where it would surface. Re-read this file whenever
# the report shows the alias resolving somewhere new.
#
# Rules: a model missing here is written to the ledger as uncosted; a call that used a cache
# or batch feature with no rate here is uncosted. The library never fills a rate in.
#
# Model keys are identifiers. The ledger prices by the identifier the vendor RETURNS and, when
# that one is not listed, by the identifier that was REQUESTED (OpenAI returns dated ids such
# as gpt-5-nano-2025-08-07 for a request of gpt-5-nano; the price is the same). Both ids are
# in the ledger row, so which one priced the call is auditable.
#
# Sources:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (cache read 0.1x input,
#              5-minute cache write 1.25x input, batch 50%). The models endpoint on 2026-09-10
#              lists claude-haiku-4-5-20251001 as the only dated id with a documented alias.
#   OpenAI:    https://developers.openai.com/api/docs/pricing (cached input shown per model,
#              batch 50%).
#   Google:    https://ai.google.dev/gemini-api/docs/pricing (paid tier; context-cache read shown
#              per model; cache storage is billed per hour, not per token, so no cache_write rate;
#              batch 50%). gemini-2.5-flash-lite returned 404 "no longer available to new
#              users" on 2026-09-10; kept here for any ledger row that still names it.
#   Together:  https://www.together.ai/pricing (serverless; one price for input and output on
#              Llama 3.3 70B).

version: 1
date: 2026-10-01
currency: USD
source: "Vendor price pages re-read 2026-09-30; every 2026-09-12 rate unchanged; two judge identifiers added; see comments for URLs and rules"

