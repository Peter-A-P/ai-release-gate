# Price list, USD per million tokens, copied from each vendor's price page on 2026-09-10 and
# re-read on 2026-09-12. Repricing is a new dated file, never an edit to an older one. This
# file supersedes 2026-09-10.yaml: the same rates, plus the two panel identifiers that had no
# entry.
#
# Why those two, added 2026-09-12. The runner estimates an arm's cost with
# `prices.lookup(provider, arm.model)`, using the identifier exactly as `panel.yaml` writes it,
# and refuses to start when any selected arm has none. Both arms below would have stopped the
# first dry run before it made a call:
#
#   openai/gpt-5.4-mini-2026-03-17  the snapshot half of the OpenAI pair. A dated snapshot and
#                                   its alias are the same model at the same price, which is
#                                   the rule this file already applies to gpt-5-nano.
#   google/gemini-flash-latest      the alias half of the Google pair. A live call on
#                                   2026-09-12 resolved it to gemini-3.8-flash, so it carries
#                                   that model's rate.
#
# **A caveat on the alias entry.** Pricing a floating alias by name means that if it moves to a
# version this file does not list, the returned id misses, the requested id hits, and the call
# is priced at the old version's rate instead of being written uncosted. The move itself is
# still visible: `model_returned` is in every ledger row and a resolution change is the single
# most valuable signal this panel produces. The cost is what would be quietly wrong, and the
# monthly ledger-against-invoice check is where it would surface. Re-read this file whenever
# the report shows the alias resolving somewhere new.
#
# Rules: a model missing here is written to the ledger as uncosted; a call that used a cache
# or batch feature with no rate here is uncosted. The library never fills a rate in.
#
# Model keys are identifiers. The ledger prices by the identifier the vendor RETURNS and, when
# that one is not listed, by the identifier that was REQUESTED (OpenAI returns dated ids such
# as gpt-5-nano-2025-08-07 for a request of gpt-5-nano; the price is the same). Both ids are
# in the ledger row, so which one priced the call is auditable.
#
# Sources:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing (cache read 0.1x input,
#              5-minute cache write 1.25x input, batch 50%). The models endpoint on 2026-09-10
#              lists claude-haiku-4-5-20251001 as the only dated id with a documented alias.
#   OpenAI:    https://developers.openai.com/api/docs/pricing (cached input shown per model,
#              batch 50%).
#   Google:    https://ai.google.dev/gemini-api/docs/pricing (paid tier; context-cache read shown
#              per model; cache storage is billed per hour, not per token, so no cache_write rate;
#              batch 50%). gemini-2.5-flash-lite returned 404 "no longer available to new
#              users" on 2026-09-10; kept here for any ledger row that still names it.
#   Together:  https://www.together.ai/pricing (serverless; one price for input and output on
#              Llama 3.3 70B).

version: 1
date: 2026-09-12
currency: USD
source: "Vendor price pages fetched 2026-09-09 and 2026-09-10; panel identifiers reconciled 2026-09-12 against the vendors' model lists and live resolutions; see comments for URLs and rules"

