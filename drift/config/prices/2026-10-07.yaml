# Price list, USD per million tokens. Repricing is a new dated file, never an edit to an older
# one. This file supersedes 2026-10-01.yaml and carries every rate in it unchanged (a test holds
# it to that) except one field: each Anthropic `cache_write`.
#
# Why, 2026-10-07. From this date the runner marks the long-context passage on Anthropic's arms
# for prompt caching with the 1-hour lifetime (PLAN.md section 2.3, amended 2026-10-07). Anthropic
# bills a 1-hour cache write at 2x the input rate and a 5-minute one at 1.25x
# (https://platform.claude.com/docs/en/build-with-claude/prompt-caching, read 2026-10-07: "1-hour
# cache writes: 2x base input tokens price"). The gateway this project pins (boundary 0.1.0) has
# one `cache_write` rate a model and reads one write count, `cache_creation_input_tokens`, which
# holds both lifetimes. Every write this project makes is a 1-hour write, so the field holds the
# 1-hour rate: Haiku 4.5 2.00, Sonnet 5 4.00, Opus 5 10.00, Sonnet 4.6 6.00. Were a 5-minute
# write ever made under this file it would be over-costed, never under-costed, which is the safe
# side for a spend cap. Cache reads stay at 0.1x input, the rate for both lifetimes.
#
# Dated the day it takes effect. `latest_price_list` takes the newest file by name, so this is
# the drift run's price list from the moment it is merged; November's run is the first priced by
# it. No call before it wrote to a cache on an Anthropic arm (the September and October ledgers
# show 0 cache tokens on all three), so no earlier row is affected by the change of rate.
#
# Everything 2026-10-01.yaml says about its other entries, the alias caveat and the January
# Google change still applies; read it there.

version: 1
