<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="758" viewBox="0 0 1142 758" role="img" aria-label="The gate answers both sides of a pull request live, has a licensed judge grade every answer, corrects the judge&#x27;s own error out of the difference, runs a paired non-inferiority test at a stated margin with a power screen, and posts a verdict whose evidence goes to the ledger and the model cards." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
