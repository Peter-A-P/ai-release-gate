<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="986" viewBox="0 0 1152 986" role="img" aria-label="On the first of the month a planning job sizes the run from the panel and the price list, one job per provider asks every frozen question five times of each of that provider&#x27;s arms through the gateway in pass-through mode, a program grades every answer, and a collecting job folds the arms into the month&#x27;s record, writes the report and commits it." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
