<rect x="440.0" y="66.0" width="272.0" height="64.0" rx="4" fill="#F2F4F3" stroke="#5C6B67" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="576.0" y="87.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The schedule</text>
<text x="576.0" y="103.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">06:00 UTC on the 1st, or by hand</text>
<text x="576.0" y="120.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">GitHub starts it hours late</text>
<rect x="440.0" y="172.0" width="272.0" height="80.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="576.0" y="193.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">plan</text>
<text x="576.0" y="209.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">panel.yaml and the price list</text>
<text x="576.0" y="225.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">size the abort cap</text>
<text x="576.0" y="242.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">drift.panel, drift.runner.run</text>
