<text x="576.0" y="543.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Program graders</text>
<text x="576.0" y="559.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">exact, constraints, structured, refusal</text>
<text x="576.0" y="576.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">drift.graders, hash stamped per record</text>
<rect x="28.0" y="522.0" width="272.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="164.0" y="543.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The refusal block</text>
<text x="164.0" y="559.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">read by hand, blind to the model</text>
<text x="164.0" y="576.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">drift refusal label</text>
<rect x="440.0" y="635.0" width="272.0" height="66.0" rx="4" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/>
<rect x="440.0" y="635.0" width="5" height="66.0" rx="2" fill="#0E6E60"/>
<text x="576.0" y="656.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">collect</text>
<text x="576.0" y="672.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">folds the arm directories, writes</text>
<text x="576.0" y="688.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">the report, commits the month</text>
<rect x="440.0" y="742.0" width="272.0" height="80.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<rect x="440.0" y="742.0" width="5" height="80.0" rx="2" fill="#A64C1C"/>
<text x="576.0" y="763.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The report</text>
<text x="576.0" y="779.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">same-day noise floor, change vs last</text>
<text x="576.0" y="795.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">run, refusals, cost per 1,000 calls</text>
<text x="576.0" y="812.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">drift/reports/&lt;month&gt;.md</text>
