<text x="576.0" y="314.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">run, one job per provider</text>
<text x="576.0" y="330.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">arms one after another, paused</text>
<text x="576.0" y="346.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">to the vendor&#x27;s rate limit</text>
<rect x="28.0" y="294.0" width="272.0" height="64.0" rx="4" fill="#F2F4F3" stroke="#5C6B67" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="164.0" y="322.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Anthropic (3 arms), OpenAI (2),</text>
<text x="164.0" y="338.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Google (2), Together (1 control)</text>
<rect x="852.0" y="286.0" width="272.0" height="80.0" rx="4" fill="#F2F4F3" stroke="#5C6B67" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="988.0" y="307.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The gateway, pass-through</text>
<text x="988.0" y="323.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">no retries, no cache, one ledger row</text>
<text x="988.0" y="339.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">per call, the price list dated</text>
<text x="988.0" y="356.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">boundary, project 04</text>
