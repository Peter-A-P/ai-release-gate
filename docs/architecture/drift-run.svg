<text x="576.0" y="429.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">420 questions x 5 asks per arm</text>
<text x="576.0" y="445.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">held-out outputs replaced by their hash</text>
<text x="576.0" y="462.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">drift.runner.records</text>
