# The three models that write the gold set's answers (PLAN.md B4).
#
# Chosen for SPREAD, not for quality. The gold set exists to calibrate a judge, and a judge is
# only tested by a set that contains real failures, so a small model is as important here as a
# large one. If all 300 answers were good, a judge that answered "faithful" to everything would
# score 100% and we would have learned nothing about it.
#
# The two vendor identifiers below are the ones this project has already made 16,800 calls
# against in the drift runs of 2026-09-13 and 2026-09-16, so they are known to work, known to
# be priced correctly in drift/config/prices, and known to answer inside a token budget.
#
# The weakest arm's job is not to be good. A gold set on which every answer is good cannot tell
# a working judge from one that says "fine" to everything, so this arm is here to get things
# wrong the way a real application's cheap tier gets things wrong.
#
# It is NOT a small model, and B4's "three models of different sizes" is served here by measured
# capability rather than by parameter count. Measured 2026-09-20, run 35529646727: of the 274
# identifiers the open-weights provider catalogues, this account can call exactly ONE. Five
# candidates were probed with a single eight-token question each and four returned
#
#   400 invalid_request_error: Unable to access non-serverless model <id>. Please visit ...
#   to create and start a new dedicated endpoint for the model.
#
# including the 3B and 4B models that would have been the obvious small arm, and including two
# with the -Turbo suffix, which kills the theory that the suffix marks what is served. A
# vendor's model list is a catalogue, not an inventory, and `panel candidates` cannot tell the
# difference; only a call can, which is what `gate gold probe-models` is for.
#
# So the spread is Llama-3.3-70B against Sonnet 5, and this project already knows how big that
# spread is, from its own record rather than from a parameter count. On the 420-item drift
# suite, 2026-09-13:
#
#   openweights-control        92.1% (89.5 to 94.5)
#   anthropic-alias (Haiku)    95.0% (92.9 to 96.9)
#   anthropic-sonnet-snapshot  97.6% (96.0 to 98.8)
#
# Five and a half points between the ends, with intervals that do not overlap. That is a real
# gap and it is measured, which is better evidence than "3B is smaller than a big model" would
# have been. It is also the one identifier this project has already made thousands of calls
# against, so it is priced, proven and known to answer inside a token budget.
#
# The judges are a separate file (gold-judges.yaml) and MUST NOT appear here. A model that both
# writes an answer and judges it is grading its own homework, and the kappa that came out of
# that would be measuring nothing.
version: 1
chosen: 2026-09-20
notes: "All three confirmed against the vendors' own model lists on 2026-09-20, run 35529080046. The two Anthropic identifiers are carried over from the drift panel and have been exercised in two full runs of 16,800 calls. The weakest arm is Llama-3.3-70B-Instruct-Turbo, the only one of the provider's 274 catalogued identifiers this account can actually call (run 35529646727). The spread it gives is measured rather than assumed: 92.1% against Sonnet 5's 97.6% on the drift suite, intervals not overlapping."

arms:
  - key: openweights-weakest
    provider: openweights
    model: meta-llama/Llama-3.3-70B-Instruct-Turbo
    arm: control
    family: weakest
  - key: anthropic-mid
    provider: anthropic
    model: claude-haiku-4-5-20251001
    arm: snapshot
    family: mid
  - key: anthropic-large
    provider: anthropic
    model: claude-sonnet-5
    arm: snapshot
    family: large
    # Sonnet 5 returns 400 "`temperature` is deprecated for this model" when the field is
    # present. Found on the first drift dry run, 2026-09-12; the same fix applies here.
    omit: [temperature]
