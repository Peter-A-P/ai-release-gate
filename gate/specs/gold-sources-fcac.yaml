# The Canadian half of the gold set: Financial Consumer Agency of Canada guidance.
#
# WHAT TO CALL OURSELVES HERE IS NOT WHAT TO CALL OURSELVES ON investor.gov, which is why this
# list carries its own. Measured 2026-09-20 from a home connection with every other variable
# held fixed: canada.ca serves the conventional crawler form, a product token plus a (+URL)
# that says who is asking, and tarpits everything else, accepting the connection and never
# sending anything, which reads as a timeout. investor.gov is the reverse and returns 403 to
# any User-Agent carrying a URL. There is no single string that reaches both.
#
# That also settles what the first probe found. Ten for ten timing out from a GitHub runner
# looked like a firewall refusing data-centre addresses; it was the User-Agent, and the same
# thing happens from a home connection with the same string. Nothing here is a disguise: both
# forms name the project, and this one additionally links to its public repository so an
# administrator can see exactly what is fetching them and why. Claiming to be a browser is
# what is never done.
#
# These are LEAF pages, not the section indexes the first list held. A section index is
# navigation: "Services and information", then a list of link descriptions. It extracts
# cleanly and is useless here, because a faithfulness question needs a passage with something
# checkable in it and a hub page has no numbers to be unfaithful about. The leaves below were
# discovered by reading the links out of each index rather than guessed.
#
# Open Government Licence - Canada, which is why the text is committed rather than the URL.

default_user_agent: "ai-release-gate/1 (+https://github.com/Peter-A-P/ai-release-gate)"

