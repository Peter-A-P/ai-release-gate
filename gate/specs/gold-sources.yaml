# The public pages the gold set's questions are answered from (PLAN.md B4).
#
# THIS LIST IS PROVISIONAL UNTIL A FETCH CONFIRMS IT. It was written without being able to open
# any of these pages: the work network's proxy makes an ordinary HTTPS read to canada.ca time
# out, so `gate gold fetch` runs in the `gold` workflow and the first run of it is a probe.
# Every failure is reported with its reason and the ones that succeeded are still committed, so
# a wrong path costs one line and one re-run rather than the list.
#
# Both publishers put this material under terms that allow storing it, which is why the text is
# committed rather than the URL:
#   fcac  Open Government Licence - Canada
#   sec   a United States government work, public domain
#
# What makes a good page here. It has to state checkable specifics (a number of days, a dollar
# limit, a named condition), because a faithfulness judge tested on a page of generalities is
# not tested at all. It has to be a content page rather than an index, which the fetcher
# enforces by refusing anything that yields under 400 characters of text.
#
# Aim: about 30 documents carrying 100 questions, so two to four questions each. Start with
# these, see which resolve, then extend. Nothing here is fetched twice: `gate gold fetch` skips
# any id already in sources.jsonl.

