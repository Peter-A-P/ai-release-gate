# The public pages the gold set's questions are answered from (PLAN.md B4).
#
# What the first probe found, 2026-09-20, run 35522317109, sixteen URLs from a GitHub runner:
#
#   investor.gov   4 of 5 fetched, 1,578 to 2,540 characters each. Works.
# investor.gov also decides what to serve by User-Agent, and decides the OPPOSITE way from
# canada.ca: it refuses any string carrying a URL, and `curl/8.5.0`, and serves the plain
# descriptive form below or no header at all. So this list keeps the default and the Canadian
# one carries its own. See docs/gold-sources.md for the table.
#
#   www.sec.gov    403 Forbidden. The SEC asks automated traffic to declare itself in the
#                  User-Agent with a contact address. Peter's only address is his employer's
#                  and this project does not put it in a request header, so www.sec.gov is
#                  left alone and investor.gov, which is the SEC's own investor education
#                  site and answers ordinary requests, carries the American half.
#   www.canada.ca  0 of 10. Every one timed out, identically. Moved to
#                  gold-sources-fcac.yaml, which explains what that means and what the
#                  options are; it is not fetched from here, because ten tarpits cost twelve
#                  minutes and tell you nothing you did not learn the first time.
#
# Second probe, 2026-09-20, run 35523102825, after the extractor learned to prefer a page's
# main region: 18 of 20 fetched, 866 to 2,556 characters each, and the passages now begin with
# the article instead of with "Skip to main content". Two 404s, both my guess at a path: bonds
# (the real one is under bonds-or-fixed-income-products) and a retirement page that does not
# exist under that name. Entries from sec-026 on are the next batch of candidates, written the
# same way and just as unconfirmed.
#
# Nine entries that DID fetch have been removed again. Three were glossary stubs (sec-020,
# sec-030, sec-031) and six more turned out to be mostly investor.gov's repeating "Featured
# Content" trailer with a paragraph or two in front of it (sec-004, sec-006, sec-012, sec-016,
# sec-019, sec-021, sec-023, sec-024). The trailer is cut now, and what was left of those pages
# was under 900 characters: a stub either way. sec-036 was a 404.
#
# The three original stubs:
# yielded 866, 800 and 570 characters, and one of those was still mostly site banner because
# its main region was too thin to prefer and the whole body was the fallback. There is barely
# anything in a stub to be unfaithful to, so it makes a poor faithfulness question. `gate gold
# status` now names any passage under 900 characters rather than leaving it to be noticed.
#
# A wrong entry is a fast 404 rather than a timeout, so probing is cheap; `gate gold status`
# says which landed, and a page yielding under 400 characters of text is refused as an index.
#
# All of it is a United States government work and in the public domain, which is why the text
# is committed rather than the URL: the page can be rewritten, and a faithfulness judgement
# made against today's wording means nothing a year later unless today's wording is kept.
#
# Aim: about 30 documents carrying 100 questions, so two to four questions each.

