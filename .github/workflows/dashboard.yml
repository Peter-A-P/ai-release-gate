name: dashboard

# Publishes the dashboard to Azure Static Web Apps as static files (PLAN.md B8.1).
#
# `gate export` writes every page and JSON document the service answers, byte for byte, from the
# committed record. Nothing runs on the site afterwards. This workflow calls no vendor and spends
# nothing; building the read model takes about a minute.
#
# Deploys with the Static Web App's deployment token, held as the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN, never an Azure credential. Until that secret exists the site
# is built and kept as an artifact, so the workflow proves the export before Azure is set up.
# After a deploy it checks the live site names this commit, so a run is green only when the
# pages people see are the ones it built.

on:
  schedule:
    # Nightly. The monthly drift run starts at 06:00 UTC on the 1st and commits within hours, so
    # the next night's build publishes it.
    - cron: "40 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drift/runs/**"
      - "drift/analysis/**"
      - "drift/graders/**"
      - "gate/**"
      - "service/**"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      # Full history is not needed, but the commit is: the footer and data/build.json name it.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # The export needs the gate and service extras. Part A's monthly job still installs
      # without them.
      - run: uv sync --frozen --all-extras

      - name: Export the site
        run: uv run gate export --out site

      - name: Keep the site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site-${{ github.run_id }}
          path: site
          retention-days: 14

      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true

      # In place of an external uptime monitor (PLAN.md B8.1 step 7). GitHub already emails the
      # owner when a scheduled run fails, so the gap is a deploy that "succeeds" while the site
      # is down or still shows the night before. This reads back what the site says it was built
      # from and fails the run unless it is this commit. build.json is served no-store
      # (service/export.py), and the query string is only belt and braces.
      - name: Check the live site serves this build
        if: env.SWA_TOKEN != ''
        env:
          SITE: https://gate.peterparker.ca
          WANT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            got=$(curl -fsS --max-time 20 "$SITE/data/build.json?run=$GITHUB_RUN_ID" \
              | jq -r 'select(.ok == true) | .commit' || true)
            if [ "$got" = "$WANT" ]; then
              echo "$SITE serves $WANT (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: site names '${got:-nothing}', want $WANT; waiting 30s"
            sleep 30
          done
          echo "::error::$SITE did not serve commit $WANT within 10 minutes of the deploy"
          exit 1

      - name: Say why nothing was deployed
        if: env.SWA_TOKEN == ''
        run: echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set; the site was built and kept as an artifact only."
