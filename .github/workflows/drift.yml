name: drift

# The monthly drift run (PLAN.md section 5): the 1st of each month at 06:00 UTC, plus a manual
# path for the first two runs and for the one permitted rerun within 72 hours. GitHub cron can
# slip by up to an hour; the actual start time is in RUN.json.
#
# Shape: one job per provider in parallel (each well under GitHub's six-hour job limit, and
# each provider's arms run one after another so one key is never hit by several jobs at
# once), then one job that folds the arm directories into the month's RUN.json, the report
# and the README table, and commits. A provider that fails still lets the others be committed.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM the run belongs to (default: the current month)"
        required: false
      items:
        description: "dry run: items per block (leave empty for the full suite)"
        required: false
      repeats:
        description: "repeats per item"
        required: false
        default: "5"
      rerun_of:
        description: "run id this rerun supersedes, if any"
        required: false
      without_heldout:
        description: "public items only (dry runs before the held-out secret exists)"
        required: false
        default: "false"
      abort_multiplier:
        description: "abort an arm past this multiple of its expected cost (dry runs need more than 1.5)"
        required: false
        default: "1.5"
      dry_run:
        description: "a rehearsal: own month, never writes the README table. Implied by `items`; set it for a FULL dry run"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: drift-run
  cancel-in-progress: false

env:
  UV_PYTHON: "3.13"

jobs:
  plan:
    # Fails fast, before any vendor is called, if the suite or the panel is not in order.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      month: ${{ steps.plan.outputs.month }}
      providers: ${{ steps.plan.outputs.providers }}
      dry: ${{ steps.plan.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - id: plan
        env:
          DRIFT_HELDOUT_ITEMS: ${{ secrets.DRIFT_HELDOUT_ITEMS }}
        run: |
          # A dry run is anything with an item limit, plus anything that says so. The limit
          # alone is not enough: a FULL dry run is all items at k = 5 and so sets no limit,
          # which is exactly the run whose records must not land in the official month and
          # whose numbers must not reach the README. That run is the most expensive one to get
          # wrong, so it gets an explicit flag rather than an inference.
          DRY="false"
          if [ -n "${{ inputs.items }}" ] || [ "${{ inputs.dry_run }}" = "true" ]; then DRY="true"; fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          MONTH="${{ inputs.month }}"
          if [ -z "$MONTH" ]; then
            MONTH=$(date -u +%Y-%m)
            # Records live in drift/runs/<month>/<arm>/ and a run RESUMES from whatever is
            # already there. A dry run on the plain month would therefore be read by the
            # official run as work already done, and those items would never be asked. So an
            # unlabelled dry run gets its own month and cannot touch the real one. Passing
            # `month` explicitly overrides this, deliberately.
            if [ "$DRY" = "true" ]; then MONTH="$MONTH-dry"; fi
          fi
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "providers=$(uv run drift panel providers --json)" >> "$GITHUB_OUTPUT"
          uv run drift panel show
          if [ "${{ inputs.without_heldout }}" = "true" ]; then
            uv run drift suite verify
          else
            uv run drift suite verify --heldout
          fi

  run:
    needs: plan
    runs-on: ubuntu-24.04
    # Pinned image so the same runner shape is used every month. Under the six-hour job limit.
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Run the ${{ matrix.provider }} arms
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENWEIGHTS_API_KEY: ${{ secrets.OPENWEIGHTS_API_KEY }}
          DRIFT_HELDOUT_ITEMS: ${{ secrets.DRIFT_HELDOUT_ITEMS }}
        run: |
          # Anthropic's entry tier allows 50 requests a minute. Its three arms run one after
          # another inside this one job, so only one call is ever in flight and the rate is
          # 60 / (latency + pause). At the measured mean latencies of 2026-09-12, 2.1s for the
          # two Haiku arms and 3.0s for Sonnet, a 0.2s pause gives 20 to 26 requests a minute,
          # comfortably inside the tier.
          #
          # It was 1.0s until 2026-09-12 and that no longer fits the clock. Raising the output
          # budgets made responses longer, and 3.1 to 4.0 seconds a call across 6,300 calls
          # projects to 356 minutes, past this job's 340-minute timeout and close to GitHub's
          # six-hour hard limit. The full dry run and then the Sep 27 official run would both
          # have died partway through the Anthropic arms, after spending the money. At 0.2s the
          # projection is 272 minutes, which leaves an hour of margin.
          #
          # If it ever needs to be faster than this, the next move is one job per arm rather
          # than per provider, but that puts three jobs on one key at once and the tier will
          # not take it. The pause is the safe lever; the job split is not.
          case "${{ matrix.provider }}" in
            anthropic) PAUSE=0.2 ;;
            *) PAUSE=0.2 ;;
          esac
          ARGS="--month ${{ needs.plan.outputs.month }} --provider ${{ matrix.provider }} --repeats ${{ inputs.repeats || '5' }} --pause $PAUSE --no-collect"
          # The expected cost assumes 700 input tokens a call, which is right for the whole
          # suite (measured mean 474) but wrong for a dry run: --items takes N from EVERY
          # block, so the 20 long-context items become one call in seven instead of one in 21
          # and the mean input rises to about 1,240. Every arm would then sit near 1.9x its
          # expected cost with no vendor having done anything unusual. The monthly run keeps
          # 1.5x; a dry run says so explicitly.
          ARGS="$ARGS --abort-multiplier ${{ inputs.abort_multiplier || '1.5' }}"
          if [ -n "${{ inputs.items }}" ]; then ARGS="$ARGS --items ${{ inputs.items }}"; fi
          if [ -n "${{ inputs.rerun_of }}" ]; then ARGS="$ARGS --rerun-of ${{ inputs.rerun_of }}"; fi
          if [ "${{ inputs.without_heldout }}" = "true" ]; then ARGS="$ARGS --without-heldout"; fi
          uv run drift run $ARGS || echo "run finished with a non-complete status; the record is still uploaded"
      - name: Upload the arm directories
        # Always, so a partial record survives a failure. The held-out raw store never leaves
        # the runner.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.provider }}
          path: |
            drift/runs/${{ needs.plan.outputs.month }}/${{ matrix.provider }}-*
            !drift/runs/${{ needs.plan.outputs.month }}/${{ matrix.provider }}-*/raw-heldout
          if-no-files-found: error
          retention-days: 7

  collect:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          path: drift/runs/${{ needs.plan.outputs.month }}
          merge-multiple: true
      - name: Fold the arms into the month
        # --no-readme on a dry run. `collect` writes the README results table by default and
        # the next step commits and pushes it, so without this a seven-item dry run would
        # publish itself as the project's measured result.
        run: |
          ARGS="--month ${{ needs.plan.outputs.month }}"
          if [ "${{ needs.plan.outputs.dry }}" = "true" ]; then ARGS="$ARGS --no-readme"; fi
          uv run drift collect $ARGS || echo "month is not complete; the record is still committed"
      - name: Commit the record
        run: |
          git config user.name "Peter Parker"
          git config user.email "peter.alexander.parker@outlook.com"
          git add drift/runs drift/reports README.md
          git commit -m "Drift run ${{ needs.plan.outputs.month }}: records, report, README table" || echo "nothing to commit"
          git pull --rebase origin main
          git push
