name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be repeated without a dummy commit.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # boundary installs anonymously: its repository is public, so no token is needed.
      # --all-extras brings in Part B's `gate` extra (mselect); the monthly job installs without it.
      - run: uv sync --frozen --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
