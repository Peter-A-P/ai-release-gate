name: gold

# Part B stage 2: generating the judge calibration gold set, and running a judge over it.
#
# This is a manual workflow, never scheduled. It is the only place in the project besides the
# monthly drift run where vendor calls are made, for the reason CLAUDE.md gives: this project's
# laptop sits behind a TLS inspection proxy on the work network, so vendor calls belong here.
#
# Both jobs are RESUMABLE and both are bounded by `--limit`. A run that stops halfway leaves a
# committed prefix, and running it again continues from there rather than paying twice.
#
# `what=sources` spends nothing at all: it reads public pages. The other two spend.
#
# The whole of stage 2 is about US$2 (300 answers) and stage 3 about US$6 (two judges, 300
# instances, two readings and a swap). The `limit` input exists so the first run of each can be
# a handful of calls that prove the wiring before the rest is paid for.

on:
  workflow_dispatch:
    inputs:
      what:
        description: "sources (fetch the pages), answers, distractors (the d- stratum), judge"
        required: true
        type: choice
        options: [sources, answers, distractors, judge, probe-models]
        default: sources
      judge_key:
        description: "for what=judge: which judge in gate/specs/gold-judges.yaml"
        required: false
        default: openai-judge-small
      repeats:
        description: "for what=judge: readings per instance (2 gives the test-retest figure)"
        required: false
        default: "1"
      max_tokens:
        description: "for what=judge: output budget; Gemini 3.8 Flash thinks first and needs 1024"
        required: false
        default: "64"
      swap:
        description: "for what=judge: also read each case with the parts reordered (order bias)"
        required: false
        type: boolean
        default: false
      only:
        description: "for what=sources: comma separated source ids, for retrying a few"
        required: false
        default: ""
      models:
        description: "for what=probe-models: comma separated provider/model identifiers"
        required: false
        default: ""
      limit:
        description: "stop after this many vendor calls; 0 for no limit. Start small."
        required: false
        default: "6"

# One gold run at a time. Every run commits gate/gold/ledger.sqlite, which is binary and cannot
# be merged, so two runs dispatched together race and the second loses its record at the
# commit step after its calls are paid for. Found 2026-09-23 with two judge probes: the
# Google one's six verdicts were discarded. Queued rather than cancelled, so nothing paid for
# is thrown away.
concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  gold:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # --all-extras: the gate needs mselect, which the monthly drift job does not install.
      - run: uv sync --frozen --all-extras

      - name: Show what is there before anything is spent
        run: uv run gate gold status

      - name: Fetch the source documents
        if: ${{ inputs.what == 'sources' }}
        # No vendor, no key, no spend: this reads public regulator pages. It is here rather
        # than on the laptop because the work network's proxy makes the read time out. A page
        # that fails is reported with its reason and the rest are still stored, so a wrong path
        # in gate/specs/gold-sources.yaml costs one line and one re-run.
        run: |
          ARGS="--i-am-allowed-to-reach-the-internet"
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          uv run gate gold fetch $ARGS || echo "some pages failed; the ones that worked are kept"

      - name: Probe whether models are actually servable
        if: ${{ inputs.what == 'probe-models' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENWEIGHTS_API_KEY: ${{ secrets.OPENWEIGHTS_API_KEY }}
        run: |
          uv run gate gold probe-models             --i-am-allowed-to-call-vendors             --models "${{ inputs.models }}"

      - name: Generate the gold set's answers
        if: ${{ inputs.what == 'answers' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENWEIGHTS_API_KEY: ${{ secrets.OPENWEIGHTS_API_KEY }}
        run: |
          uv run gate gold generate \
            --i-am-allowed-to-call-vendors \
            --limit "${{ inputs.limit }}"

      - name: Generate the distractor stratum
        if: ${{ inputs.what == 'distractors' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENWEIGHTS_API_KEY: ${{ secrets.OPENWEIGHTS_API_KEY }}
        run: |
          uv run gate gold generate \
            --i-am-allowed-to-call-vendors \
            --distractors \
            --run-id "distractors-1" \
            --limit "${{ inputs.limit }}"

      - name: Run a judge over the gold set
        if: ${{ inputs.what == 'judge' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENWEIGHTS_API_KEY: ${{ secrets.OPENWEIGHTS_API_KEY }}
        run: |
          ARGS="--i-am-allowed-to-call-vendors --judge-key ${{ inputs.judge_key }}"
          ARGS="$ARGS --repeats ${{ inputs.repeats }} --limit ${{ inputs.limit }}"
          ARGS="$ARGS --max-tokens ${{ inputs.max_tokens }}"
          if [ "${{ inputs.swap }}" = "true" ]; then ARGS="$ARGS --swap"; fi
          uv run gate judge run $ARGS

      - name: Say what is there now
        # Runs even when the step above failed, because a partial run has still been paid for
        # and its records are still worth committing.
        if: always()
        run: uv run gate gold status

      - name: Commit the record
        if: always()
        run: |
          git config user.name "Peter Parker"
          git config user.email "peter.alexander.parker@outlook.com"
          # The ledger's SQLite sidecars are gitignored for the reason drift/runs' are: they
          # are scratch, they are rewritten merely by opening the database, and 128 of them
          # once buried the real changes in this repository.
          git add gate/gold
          git commit -m "Gold set: ${{ inputs.what }}${{ inputs.what == 'judge' && format(' ({0})', inputs.judge_key) || '' }}" || echo "nothing to commit"
          git pull --rebase origin main
          git push
