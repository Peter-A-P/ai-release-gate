[project]
name = "drift"
version = "0.1.0.dev1"
description = "AI Release Gate, Part A: a frozen-suite, monthly record of language-model drift with a same-day noise floor."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Peter Parker" }]
dependencies = [
  # Every vendor call goes through the portfolio gateway library in pass-through mode. Pinned to
  # the 0.x line the 04 plan promises additive changes within; installed from git
  # (see [tool.uv.sources]).
  "boundary>=0.1.0.dev1,<0.3",
  # Item, panel and record schemas.
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  # The structured-extraction grader validates against a JSON schema.
  "jsonschema>=4,<5",
  # Command line. 0.x is the only line; pinned below 1.
  "typer>=0.15,<1",
  # Declared even though typer already brings it: `drift refusal label` imports click directly
  # for getchar(), a single keypress per answer rather than a keypress and a return. Over the
  # 77 answers of a labelling pass that is 77 fewer keystrokes, and an import that is used is
  # an import that is declared.
  "click>=8,<9",
]

[project.optional-dependencies]
# Part B, the gate. An extra rather than a core dependency so that the monthly drift job, which
# runs `uv sync --frozen` with no extras, installs exactly what it installed before Part B began:
# mselect brings numpy, scipy, polars, pyarrow and matplotlib, none of which the record needs, and
# a dependency the October run does not need is a way for the October run to fail that it did not
# have in September. CI installs it with --all-extras.
gate = [
  # The power analysis and the local-dependence correction (PLAN.md B5): project 02's published
  # bank, imported rather than reimplemented. Pinned to the 0.3 line, which is the line whose
  # re-exported interface 02's own CHANGELOG promises not to change.
  "mselect>=0.3,<0.4",
]
# Part B stage 6, the dashboard (`service/`). Its own extra so neither the monthly drift job nor
# the gate on a pull request installs a web server it never runs. CI installs it with
# --all-extras.
service = [
  # The read-only API and the server-rendered pages (PLAN.md B2.1, B8). 0.x is the only line and
  # FastAPI's minor releases have broken things before, so pinned to the 0.141 line.
  "fastapi>=0.141,<0.142",
  # The ASGI server the service runs under. 0.x only; pinned below 1.
  "uvicorn>=0.54,<1",
  # The read model (PLAN.md B3: "DuckDB arrives with the service as a read model"), built in
  # memory from the committed JSON lines and never written to. 1.x keeps its SQL stable.
  "duckdb>=1.5,<2",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "mypy>=1,<2",
  "ruff>=0.13,<1",
  "types-PyYAML>=6,<7",
  "types-jsonschema>=4,<5",
  # FastAPI's TestClient, for the service's tests. Starlette 1.x imports httpx2 first and warns
  # that plain httpx is deprecated for its test client. Pinned to the 2.x line.
  "httpx2>=2.13,<3",
]

[tool.uv.sources]
# Public since 2026-09-14, so CI installs it anonymously and no token is involved. Pinned to
# the v0.1.0 tag: a fix a run needs is a v0.1.1 branched from the tag, never a move of the tag.
boundary = { git = "https://github.com/Peter-A-P/compliant-ai-gateway", tag = "v0.1.0" }
# Public. Pinned to the tag for the same reason: a lockfile resolves to one commit.
mselect = { git = "https://github.com/Peter-A-P/model-selection-tenth-cost", tag = "v0.3.2" }

[tool.uv]
# mselect declares `boundary>=0.2` for its own vendor runner, which this project does not use:
# nothing reachable from `import mselect` imports boundary at all, and the four calls Part B
# makes of it (items_needed, dependence, dependent_blocks, reliability) read files that ship
# inside the package. Taking that constraint would drag this project's gateway from 0.1.0 to
# 0.2.x, and boundary 0.2.0 upgrades a v1 ledger IN PLACE the first time it opens one. There
# are 80 committed ledgers under drift/runs/. Upgrading them would rewrite committed run
# artefacts and, worse, leave them unreadable by the version that wrote them, in the middle of
# a twelve-month record whose whole claim is that the apparatus was held fixed. So the pin
# stands and the constraint is overridden, with the reason in writing.
override-dependencies = ["boundary==0.1.0"]

[project.scripts]
drift = "drift.cli:app"
# Part B. Needs the `gate` extra.
gate = "gate.cli:app"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drift", "gate", "service"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff formats Python blocks inside Markdown by default; the plan and docs keep their layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Adversarial fixtures deliberately contain unicode digits and confusable characters.
"tests/test_graders.py" = ["RUF001"]
# The sampler's tests assert that curly quotes and typographic dashes in upstream benchmark
# text are mapped or rejected, so they have to contain those characters.
"tests/test_sampling.py" = ["RUF001"]
# The red-team leak grader is tested against fullwidth and Arabic-Indic digits, and the report
# against typographic dashes it must never print.
"tests/test_redteam.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["drift", "gate", "service", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# mselect is typed and mypy-strict clean in its own repository but ships no py.typed marker, so
# its annotations are invisible from here. Everything this project takes from it is wrapped in
# gate/stats.py behind typed signatures, and that is the surface the checker sees.
module = "mselect.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
