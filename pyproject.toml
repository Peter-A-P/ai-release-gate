[project]
name = "drift"
version = "0.1.0.dev1"
description = "AI Release Gate, Part A: a frozen-suite, monthly record of language-model drift with a same-day noise floor."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Peter Parker" }]
dependencies = [
  # Every vendor call goes through the portfolio gateway library in pass-through mode. Pinned to
  # the 0.x line the 04 plan promises additive changes within; installed from its private
  # repository (see [tool.uv.sources]).
  "boundary>=0.1.0.dev1,<0.3",
  # Item, panel and record schemas.
  "pydantic>=2,<3",
  "pyyaml>=6,<7",
  # The structured-extraction grader validates against a JSON schema.
  "jsonschema>=4,<5",
  # Command line. 0.x is the only line; pinned below 1.
  "typer>=0.15,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "mypy>=1,<2",
  "ruff>=0.13,<1",
  "types-PyYAML>=6,<7",
  "types-jsonschema>=4,<5",
]

[tool.uv.sources]
# Private until the first measured numbers; CI authenticates with a fine-grained read token
# (see .github/workflows). Pinned to the v0.1.0 tag once it exists; main until then.
boundary = { git = "https://github.com/Peter-A-P/compliant-ai-gateway", tag = "v0.1.0" }

[project.scripts]
drift = "drift.cli:app"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drift"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff formats Python blocks inside Markdown by default; the plan and docs keep their layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Adversarial fixtures deliberately contain unicode digits and confusable characters.
"tests/test_graders.py" = ["RUF001"]
# The sampler's tests assert that curly quotes and typographic dashes in upstream benchmark
# text are mapped or rejected, so they have to contain those characters.
"tests/test_sampling.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["drift", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
